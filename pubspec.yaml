name: tpl_starter
description: "A local-first Android starter template: Flutter UI chassis, zh/en l10n, CI and signed release pipeline."
publish_to: 'none'

# Android: build-name -> versionName, build-number -> versionCode。
# versionCode 必须单调递增；发版脚本负责 +1，系统升级安装依赖它。
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 日期/时间格式化统一走 intl，不手拼用户可见日期。
  intl: ^0.20.3
  # 2–8 项静态单选统一走锚点菜单，应用只负责把设计令牌桥接到 ThemeExtension。
  anchored_menu: ^0.1.3
  # 设备偏好（主题、语言、强调色）；不存放业务数据。
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # lint 基线：flutter_lints + 一组偏正确性的规则。
  flutter_lints: ^6.0.0
  # 仅供 scripts/ 下的仓库脚本使用，不进 APK。
  path: ^1.9.0

flutter:
  uses-material-design: true
  # 由 lib/l10n/*.arb 生成本地化代码（见 l10n.yaml）。
  generate: true
