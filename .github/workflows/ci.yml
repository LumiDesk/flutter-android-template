name: CI

# 质量门禁：格式、静态分析、测试、debug APK、release APK 编译。
# 发版构建（打 tag 出签名包）在 release.yml，两者分离。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 依赖、wrapper 与任务缓存跨运行复用。首次仍需下载；
      # 之后 debug + release 两次构建能省掉一半以上的时间。
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # 输出实际格式差异，便于排查本地与 CI SDK 的 formatter 差异。
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format .
            git diff -- '*.dart'
            exit 1
          fi

      - name: Check generated l10n is committed
        # lib/l10n/app_localizations*.dart 是提交进仓库的；改了 ARB 忘了重新生成时
        # 这里会红，而不是等到运行时发现少文案。
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n; then
            git diff -- lib/l10n
            echo "l10n 生成物过期：本地跑 flutter gen-l10n 并提交" >&2
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      # Dart 层测试不会编译 android/ 下的 Kotlin；这里额外构建一次 debug APK，
      # 提前拦住 MethodChannel、Manifest 与 Gradle 配置错误。
      # 只出 arm64：调试包要的是「能装到手机上」，三 ABI 全打会让这一步慢一倍多。
      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      # release 的 R8/资源裁剪只有发布时才会走到，CI 也构建一次，
      # 避免 release-only 崩溃拖到打 tag 才暴露。
      # 密钥每次现生成、用完即丢，只为验证编译链路；真正的发布签名见 release.yml。
      - name: Create ephemeral signing material
        run: |
          mkdir -p signing
          keytool -genkeypair -v -keystore signing/ci.jks -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-only-pass -keypass ci-only-pass \
            -dname "CN=ci, O=ci, C=CN"
          printf 'storeFile=signing/ci.jks\nstorePassword=ci-only-pass\nkeyAlias=ci\nkeyPassword=ci-only-pass\n' \
            > signing/keystore.properties

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify release APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
