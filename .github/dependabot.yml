version: 2
# 保持模板不过期：依赖与 Actions 每周检查一次，PR 由 CI 把关。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # Flutter SDK 版本由 pubspec 的 environment 约束，别让它被自动放宽。
    ignore:
      - dependency-name: flutter
